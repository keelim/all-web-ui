name: Publish Package

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: publish-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Setup Node registry auth
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@keelim'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version
        run: bun run ./scripts/verify-package.mjs release-version

      - name: Verify package version is unpublished
        run: bun run ./scripts/verify-package.mjs publish-version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Consumer smoke test
        run: bun run package:smoke

      - name: Verify npm pack contents
        run: bun run pack:verify

      - name: Publish
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
