name: Publish Package

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: publish-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise tools
        uses: jdx/mise-action@v5
        with:
          version: '2026.10.8'
          install_args: --locked
          cache: false

      - name: Setup Node registry auth
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          registry-url: https://npm.pkg.github.com
          scope: '@keelim'

      - name: Install dependencies
        run: mise run install

      - name: Verify release version
        run: bun run ./scripts/verify-package.mjs release-version

      - name: Verify package version is unpublished
        run: bun run ./scripts/verify-package.mjs publish-version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check development environment
        run: mise run doctor

      - name: Typecheck
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build

      - name: Consumer smoke test
        run: bun run package:smoke

      - name: Verify npm pack contents
        run: bun run pack:verify

      - name: Publish
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
