name: Verify Package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise tools
        uses: jdx/mise-action@v5
        with:
          version: '2026.10.8'
          install_args: --locked
          cache: false

      - name: Check development environment
        run: mise run doctor

      - name: Install dependencies
        run: mise run install

      - name: Verify package
        run: mise run verify
